[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "crewgit"
version = "0.1.0"
description = "Git-native collaboration layer for multiple coding agents: worktrees, task contracts, gates, provenance, replay."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CrewGit contributors" }]
keywords = ["ai-agents", "multi-agent", "git", "worktree", "code-review", "automation", "claude-code", "codex", "provenance", "ai-coding"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "PyYAML>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
crewgit = "crewgit.cli:app"

[project.urls]
Homepage = "https://github.com/kll-92/crewgit"
Source = "https://github.com/kll-92/crewgit"
Issues = "https://github.com/kll-92/crewgit/issues"
Changelog = "https://github.com/kll-92/crewgit/blob/main/CHANGELOG.md"
Documentation = "https://github.com/kll-92/crewgit/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/crewgit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]  # B008: Typer/FastAPI declare options in defaults by design

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
